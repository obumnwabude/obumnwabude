    <style>
      :root {
        --bg: #f8fafd;
        --text: #0b1329;
        --gray: #5b6b82;
        --primary: #101e9f;
        --primary-fg: #ffffff;
        --border: rgba(16, 30, 159, 0.12);
        --card: rgba(255, 255, 255, 0.75);
        color-scheme: light;
      }
      :root.dark {
        --bg: #07090e;
        --text: #f1f5f9;
        --gray: #94a3b8;
        --primary: #60a5fa;
        --primary-fg: #060911;
        --border: rgba(255, 255, 255, 0.1);
        --card: rgba(13, 20, 36, 0.6);
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background:
          radial-gradient(60vmax 40vmax at 10% -10%, color-mix(in srgb, var(--primary) 14%, transparent), transparent 70%),
          var(--bg);
        color: var(--text);
        font: 16px/1.6 Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      main {
        width: min(520px, 100%);
        padding: 36px 32px;
        border-radius: 24px;
        border: 1px solid var(--border);
        background: var(--card);
        backdrop-filter: blur(18px);
      }
      .logo {
        color: var(--text);
        text-decoration: none;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.03em;
      }
      .logo span {
        color: var(--primary);
      }
      .code {
        margin: 28px 0 4px;
        font-size: 72px;
        line-height: 1;
        font-weight: 800;
        letter-spacing: -0.04em;
        color: var(--primary);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 24px;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0 0 24px;
        color: var(--gray);
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      nav a {
        padding: 9px 16px;
        border-radius: 12px;
        border: 1px solid var(--border);
        color: var(--text);
        text-decoration: none;
        font-weight: 500;
      }
      nav a:first-child {
        background: var(--primary);
        border-color: var(--primary);
        color: var(--primary-fg);
      }
      nav a:hover,
      nav a:focus-visible {
        border-color: var(--primary);
      }
      a:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
      }
      .hero {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin: 28px 0 4px;
      }
      .hero .code {
        margin: 0;
      }
      .rocket {
        width: 170px;
        height: auto;
        flex-shrink: 0;
        overflow: visible;
      }
      .rocket .trail {
        fill: none;
        stroke: var(--primary);
        stroke-opacity: 0.35;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-dasharray: 2 6;
        animation: trail 2.4s linear infinite;
      }
      .rocket .ship {
        transform-box: fill-box;
        transform-origin: center;
        animation: drift 5s ease-in-out infinite;
      }
      .rocket .hull {
        fill: var(--card);
        stroke: var(--primary);
        stroke-width: 2;
        stroke-linejoin: round;
      }
      .rocket .fin {
        fill: var(--primary);
        fill-opacity: 0.25;
        stroke: var(--primary);
        stroke-width: 2;
        stroke-linejoin: round;
      }
      .rocket .window {
        fill: var(--primary);
        fill-opacity: 0.85;
      }
      .rocket .flame {
        fill: #f59e0b;
        transform-box: fill-box;
        transform-origin: 50% 0;
        animation: flicker 0.35s ease-in-out infinite alternate;
      }
      .rocket .star {
        fill: var(--primary);
        transform-box: fill-box;
        transform-origin: center;
        animation: twinkle 3s ease-in-out infinite;
      }
      .rocket .star:nth-of-type(2) {
        animation-delay: 1s;
      }
      .rocket .star:nth-of-type(3) {
        animation-delay: 2s;
      }
      @keyframes drift {
        0%,
        100% {
          transform: translate(0, 0) rotate(0deg);
        }
        50% {
          transform: translate(6px, -8px) rotate(6deg);
        }
      }
      @keyframes flicker {
        from {
          transform: scaleY(0.75);
          opacity: 0.8;
        }
        to {
          transform: scaleY(1.15);
          opacity: 1;
        }
      }
      @keyframes twinkle {
        0%,
        100% {
          opacity: 0.2;
          transform: scale(0.6);
        }
        50% {
          opacity: 0.9;
          transform: scale(1);
        }
      }
      @keyframes trail {
        to {
          stroke-dashoffset: -16;
        }
      }
      @media (max-width: 400px) {
        .rocket {
          width: 110px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .rocket * {
          animation: none !important;
        }
      }
    </style>

    </script>
  </head>
