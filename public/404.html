<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Page not found | Obum (Obumuneme Nwabude)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
    <script>
      // Same theme choice as the rest of the site (stored by the theme menu).
      try {
        var mode = localStorage.getItem('theme');
        var dark = mode === 'Dark Theme' || (mode !== 'Light Theme' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
    <style>
      :root {
        --bg: #f8fafd;
        --text: #0b1329;
        --gray: #5b6b82;
        --primary: #101e9f;
        --primary-fg: #ffffff;
        --border: rgba(16, 30, 159, 0.12);
        --card: rgba(255, 255, 255, 0.75);
        color-scheme: light;
      }
      :root.dark {
        --bg: #07090e;
        --text: #f1f5f9;
        --gray: #94a3b8;
        --primary: #60a5fa;
        --primary-fg: #060911;
        --border: rgba(255, 255, 255, 0.1);
        --card: rgba(13, 20, 36, 0.6);
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background:
          radial-gradient(60vmax 40vmax at 10% -10%, color-mix(in srgb, var(--primary) 14%, transparent), transparent 70%),
          var(--bg);
        color: var(--text);
        font: 16px/1.6 Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      main {
        width: min(520px, 100%);
        padding: 36px 32px;
        border-radius: 24px;
        border: 1px solid var(--border);
        background: var(--card);
        backdrop-filter: blur(18px);
      }
      .logo {
        color: var(--text);
        text-decoration: none;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.03em;
      }
      .logo span {
        color: var(--primary);
      }
      .code {
        margin: 28px 0 4px;
        font-size: 72px;
        line-height: 1;
        font-weight: 800;
        letter-spacing: -0.04em;
        color: var(--primary);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 24px;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0 0 24px;
        color: var(--gray);
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      nav a {
        padding: 9px 16px;
        border-radius: 12px;
        border: 1px solid var(--border);
        color: var(--text);
        text-decoration: none;
        font-weight: 500;
      }
      nav a:first-child {
        background: var(--primary);
        border-color: var(--primary);
        color: var(--primary-fg);
      }
      nav a:hover,
      nav a:focus-visible {
        border-color: var(--primary);
      }
      a:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
      }
    </style>
    <!-- Google Analytics: count 404s so broken inbound links show up in reports. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-VLJ5M4SZ44"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('js', new Date());
      gtag('config', 'G-VLJ5M4SZ44', { page_title: '404 Not Found' });
      gtag('event', 'page_not_found', { attempted_path: location.pathname, referrer: document.referrer || '(none)' });
    </script>
  </head>
  <body>
    <main>
      <a class="logo" href="/">Obum<span>.</span></a>
      <div class="code">404</div>
      <h1>This page doesn't exist</h1>
      <p>The link may be old or mistyped. Everything on the site is one of these pages:</p>
      <nav aria-label="Site pages">
        <a href="/">Home</a>
        <a href="/projects">Projects</a>
        <a href="/articles">Articles</a>
        <a href="/community">Community</a>
      </nav>
    </main>
  </body>
</html>
